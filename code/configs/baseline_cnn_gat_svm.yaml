defaults: base.yaml
run_name: "baseline_cnn_gat_svm"
feature_set: "baseline_cnn"
feature_dim: 512
classifier_head: "gat_svm"
train:
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0001
  hidden_dim: 256
  dropout: 0.1
gat:
  k_neighbors: 8
  n_heads: 4
  n_layers: 2
svm_params:
  C: 1.0
  kernel: "rbf"
